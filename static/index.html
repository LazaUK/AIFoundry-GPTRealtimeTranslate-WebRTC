<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GPT-realtime-translate (WebRTC)</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; background: #fafafa; }
        .controls { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        select { padding: 10px 16px; font-size: 15px; border-radius: 6px; border: 1px solid #d1d5db; }
        #transcript { padding: 20px; background: #fff; border: 1px solid #e1e4e8; border-radius: 12px; height: 350px; overflow-y: auto; line-height: 1.6; font-size: 16px; color: #24292e; }
        .status { font-size: 13px; color: #6a737d; margin-bottom: 10px; }
        button { padding: 12px 24px; font-size: 16px; font-weight: 600; cursor: pointer; border-radius: 6px; border: none; color: white; }
        #startBtn { background: #2ea44f; }
        #stopBtn { background: #d73a49; }
        button:disabled, select:disabled { background: #fafbfc !important; color: #959da5; border: 1px solid #e1e4e8; cursor: not-allowed; }
    </style>
</head>
<body>
    <h2>GPT-realtime-translate (WebRTC)</h2>
    <p class="status">Speak any language. The model translates into the target language below and speaks it back.</p>

    <div class="controls">
        <label for="langSelect">Translate Target:</label>
        <select id="langSelect">
            <option value="es" selected>Spanish (Español)</option>
            <option value="en">English</option>
            <option value="fr">French (Français)</option>
            <option value="ja">Japanese (日本語)</option>
            <option value="pt">Portuguese (Português)</option>
            <option value="ru">Russian (Русский)</option>
            <option value="zh">Chinese (中文)</option>
            <option value="de">German (Deutsch)</option>
            <option value="ko">Korean (한국어)</option>
            <option value="hi">Hindi (हिन्दी)</option>
            <option value="id">Indonesian (Bahasa Indonesia)</option>
            <option value="vi">Vietnamese (Tiếng Việt)</option>
            <option value="it">Italian (Italiano)</option>
        </select>
        <button id="startBtn">Start Translating</button>
        <button id="stopBtn" disabled>Stop</button>
    </div>

    <div class="status" id="status">Idle.</div>
    <div id="transcript"></div>
    <audio id="translatedAudio" autoplay></audio>

    <script>
        let pc, stream;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const langSelect = document.getElementById('langSelect');
        const transcript = document.getElementById('transcript');
        const status = document.getElementById('status');
        const audioEl = document.getElementById('translatedAudio');

        startBtn.onclick = async () => {
            startBtn.disabled = true;
            stopBtn.disabled = false;
            langSelect.disabled = true;
            transcript.textContent = '';

            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                pc = new RTCPeerConnection();
                pc.onconnectionstatechange = () => status.textContent = 'Connection: ' + pc.connectionState;

                // Play the translated speech.
                pc.ontrack = (e) => audioEl.srcObject = e.streams[0];
                pc.addTrack(stream.getAudioTracks()[0], stream);

                // Translation events arrive on this data channel.
                const channel = pc.createDataChannel('realtime-channel');
                channel.onmessage = (e) => {
                    const msg = JSON.parse(e.data);
                    if (msg.type === 'session.output_transcript.delta') {
                        transcript.textContent += msg.delta;
                        transcript.scrollTop = transcript.scrollHeight;
                    } else if (msg.type === 'error') {
                        status.textContent = 'Error: ' + (msg.error?.message || '');
                        console.error(msg);
                    }
                };

                await pc.setLocalDescription(await pc.createOffer());

                status.textContent = 'Connecting...';
                const res = await fetch('/connect?language=' + langSelect.value, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/sdp' },
                    body: pc.localDescription.sdp
                });
                if (!res.ok) throw new Error(await res.text());

                await pc.setRemoteDescription({ type: 'answer', sdp: await res.text() });
                status.textContent = 'Connected - start speaking.';
            } catch (err) {
                status.textContent = 'Error: ' + err.message;
                console.error(err);
                stopBtn.onclick();
            }
        };

        stopBtn.onclick = () => {
            startBtn.disabled = false;
            stopBtn.disabled = true;
            langSelect.disabled = false;
            if (pc) { pc.close(); pc = null; }
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            audioEl.srcObject = null;
            status.textContent = 'Stopped.';
        };
    </script>
</body>
</html>
